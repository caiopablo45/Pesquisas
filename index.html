        /* Header */
        .header-container {

        .filter-box { background: white; padding: 25px; border-radius: 15px; border: 1px solid #e0e0e0; }
        .kpi-card { 
            background: linear-gradient(135deg, var(--hover-green), var(--primary-green)); color: white; 
            text-align: center; padding: 25px; border-radius: 15px;
        }

        @media (min-width: 992px) {
            #dataTable td { font-size: 1.1rem; padding: 18px 15px; } 
            #dataTable th { font-size: 1.1rem; padding: 18px 15px; }
            .btn-link-download { padding: 8px 18px !important; font-size: 0.95rem !important; }
            .form-label { font-size: 1rem !important; }
            .form-select, .form-control { font-size: 1.05rem !important; height: 48px; }
            .titulo-secao { font-size: 1.6rem; }
        }
        
        /* Ajuste para Celular */
        @media (max-width: 991px) {
            #dataTable td { font-size: 0.9rem; padding: 12px; }
            #dataTable th { font-size: 0.8rem; padding: 12px; }
            #dataTable { min-width: 750px; }
            .header-container { justify-content: center; text-align: center; }
        }

        /* Estilos Gerais */
        .table-responsive { border-radius: 15px; background: white; overflow-x: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        #dataTable thead { background-color: var(--primary-green); color: white; }
        
        .btn-link-download { 
            background-color: var(--primary-green); color: white !important; border-radius: 30px; 
            text-decoration: none; display: inline-block; transition: 0.3s; font-weight: 600; padding: 6px 15px;
        }
        .btn-link-download:hover { background-color: var(--hover-green); transform: scale(1.05); }

        .badge { font-weight: 600; padding: 8px 12px !important; border-radius: 8px; }
        .badge-fauna { background-color: #ef6c00; }
        .badge-flora { background-color: #2e7d32; }
        .badge-outros { background-color: #455a64; }
        
        .titulo-secao { 
            color: var(--primary-green); font-weight: 700; margin-bottom: 25px; 
            border-left: 8px solid var(--primary-green); padding-left: 15px;

    function filterData() {
        const ano = document.getElementById('filterAno').value;
        const term = document.getElementById('searchTerm').value.toLowerCase();
        const fFauna = document.getElementById('chkFauna').checked;
        const fFlora = document.getElementById('chkFlora').checked;
        const fOutros = document.getElementById('chkOutros').checked;

        const filtered = db.filter(d => {
            const mAno = (ano === "" || d.ano === ano);
            const mTerm = d.titulo.toLowerCase().includes(term);
            
            // Lógica robusta para categorias
            let mCat = false;
            if (fFauna && d.cat.includes('Fauna')) mCat = true;
            if (fFlora && d.cat.includes('Flora')) mCat = true;
            if (fOutros && (d.cat.includes('Manejo') || d.cat.includes('Outros'))) mCat = true;
            
            return mAno && mTerm && mCat;
        });
        render(filtered);
    }

    function render(data) {
        const tbody = document.querySelector('#dataTable tbody');
        document.getElementById('kpiTotal').innerText = data.length;
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5">Nenhum artigo encontrado com esses filtros.</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(d => {
            // Define a cor da badge dinamicamente
            let badgeClass = 'badge-outros';
            if (d.cat.includes('Fauna')) badgeClass = 'badge-fauna';
            else if (d.cat.includes('Flora')) badgeClass = 'badge-flora';

            return `
            <tr>
                <td class="fw-bold text-success text-center align-middle">${d.ano}</td>
                <td class="align-middle"><span class="badge ${badgeClass}">${d.cat}</span></td>
                <td class="align-middle">${d.titulo}</td>
                <td class="text-center align-middle"><a href="${d.link}" target="_blank" rel="noopener" class="btn-link-download">Abrir</a></td>
            </tr>
            `;
        }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Popula o select de Anos automaticamente do mais recente para o mais antigo
        const anos = [...new Set(db.map(d => d.ano))].sort((a, b) => b - a);
        const sel = document.getElementById('filterAno');
        anos.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a; 
            opt.textContent = a;
            sel.appendChild(opt);
        });
        
        filterData(); // Carrega os dados iniciais
    });
</script>
